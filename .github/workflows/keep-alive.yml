name: Supabase keep-alive

on:
  schedule:
    - cron: '0 2 * * 1'   # setiap Isnin 10:00 pagi waktu Malaysia
  workflow_dispatch:       # boleh tekan "Run workflow" secara manual

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Secret SUPABASE_URL atau SUPABASE_ANON_KEY belum ditetapkan."
            exit 1
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/books?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase responded with HTTP $STATUS"
          if [ "$STATUS" = "000" ]; then exit 1; fi